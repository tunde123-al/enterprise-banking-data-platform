# Continuous integration for the Enterprise Banking Data & Analytics Platform.
# Validates Python syntax, JSON pipeline/job definitions, dbt model wiring,
# unit tests, and a small-scale end-to-end synthetic data generation + DQ run.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project (dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Compile all Python assets
        run: python -m compileall -q src tests

      - name: Validate JSON pipeline / job definitions
        run: python -c "import json,glob; [json.load(open(f)) for f in glob.glob('src/**/*.json', recursive=True)]; [json.load(open(f)) for f in glob.glob('infrastructure/**/*.json', recursive=True)]; print('JSON OK')"

      - name: Unit & project wiring tests
        run: python -m pytest -q

      - name: Synthetic data smoke test + data-quality validation
        run: |
          python -m src.data_generation.generate_all --scale 0.001 --output-dir data/generated
          python -m src.data_generation.validate_data --data-dir data/generated

      - name: FastAPI health check (smoke)
        run: |
          python -c "from src.microservices.fastapi_app.main import app; assert '/health' in app.openapi()['paths']"
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-banking-data-platform"
version = "1.0.0"
description = "Enterprise Banking Data & Analytics Platform: Lakehouse, ETL/ELT, Synapse, dbt, and Power BI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Tunde Shiyanbade" }
]
# Core: synthetic data generation, data-quality validation and the FastAPI service.
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "faker>=18.0.0",
    "pyyaml>=6.0",
    "pyarrow>=15.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
# Source-system loaders (src/data_generation/load_to_*.py).
loaders = [
    "psycopg2-binary>=2.9.6",
    "oracledb>=2.0",
    "pyodbc>=4.0.39",
    "pymongo>=4.3.3",
    "cassandra-driver>=3.28.0",
]
# Local execution of the Databricks notebooks (src/databricks/notebooks).
spark = [
    "pyspark>=3.4.0",
    "delta-spark>=2.4.0",
]
# Azure SDKs for a deployed environment; not imported by the code in this repository.
azure = [
    "azure-storage-blob>=12.16.0",
    "azure-identity>=1.12.0",
]
dbt = [
    "dbt-core>=1.6.0",
    "dbt-synapse>=1.6.0",
    "dbt-databricks>=1.7.0",
]
dev = [
    "pytest>=7.3.1",
    "pytest-cov>=4.1.0",
    "black>=23.3.0",
    "flake8>=6.0.0",
    "isort>=5.12.0",
    "mypy>=1.3.0",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 100


# Local source systems for the synthetic generators (see also the full stack
# in the repository-root docker-compose.yml).
services:
  postgres:
    image: postgres:15
    container_name: postgres-bank
    environment:
      POSTGRES_DB: core_banking
      POSTGRES_USER: bankadmin
      POSTGRES_PASSWORD: bankadmin123
    ports:
      - "5432:5432"
    volumes:
      - ./init-scripts/postgres:/docker-entrypoint-initdb.d
    networks:
      - bank-network

  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: oracle-bank
    environment:
      ORACLE_PASSWORD: oracle123
      ORACLE_DATABASE: XEPDB1
    ports:
      - "1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./init-scripts/oracle:/container-entrypoint-initdb.d
    networks:
      - bank-network

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver-bank
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "MyStrongPass123"
    ports:
      - "1433:1433"
    volumes:
      - ./init-scripts/sqlserver:/docker-entrypoint-initdb.d
    networks:
      - bank-network

  mongodb:
    image: mongo:6
    container_name: mongodb-bank
    ports:
      - "27017:27017"
    volumes:
      - ./init-scripts/mongodb:/docker-entrypoint-initdb.d:ro
    networks:
      - bank-network

  cassandra:
    image: cassandra:4
    container_name: cassandra-bank
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: "BankCluster"
    volumes:
      - ./init-scripts/cassandra:/docker-entrypoint-initdb.d:ro
    networks:
      - bank-network

networks:
  bank-network:
    driver: bridge

volumes:
  oracle-data: